<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriScan AI - Smart Calorie Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9', // Sky blue like the sky/bricks
                            600: '#0284c7',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #0ea5e9;
            width: 24px;
            height: 24px;
            -webkit-animation: spin 1s linear infinite; /* Safari */
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Custom scrollbar for meal list */
        .meal-list::-webkit-scrollbar {
            width: 6px;
        }
        .meal-list::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        .meal-list::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 10px;
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden text-slate-800">

    <!-- Header & Stats Area -->
    <header class="bg-white shadow-sm z-10 flex-shrink-0">
        <div class="px-6 py-4">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                    <i class="bi bi-camera-fill text-brand-500"></i> NutriScan AI
                </h1>
                <button onclick="resetData()" class="text-xs text-slate-400 hover:text-red-500">Reset</button>
            </div>
            
            <!-- Progress Card -->
            <div class="bg-gradient-to-r from-brand-600 to-brand-500 rounded-2xl p-5 text-white shadow-lg relative overflow-hidden">
                <div class="absolute top-0 right-0 -mt-4 -mr-4 w-24 h-24 bg-white opacity-10 rounded-full blur-xl"></div>
                <div class="flex justify-between items-end">
                    <div>
                        <p class="text-brand-100 text-sm font-medium mb-1">Calories Today</p>
                        <h2 class="text-4xl font-bold tracking-tight" id="totalCaloriesDisplay">0</h2>
                        <p class="text-xs text-brand-100 mt-1">Goal: <span id="calorieGoalDisplay">2000</span> kcal</p>
                    </div>
                    <div class="relative w-16 h-16">
                        <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="40" stroke="currentColor" stroke-width="8" fill="transparent" class="text-brand-900 opacity-20" />
                            <circle id="progressCircle" cx="50" cy="50" r="40" stroke="currentColor" stroke-width="8" fill="transparent" stroke-dasharray="251.2" stroke-dashoffset="251.2" class="text-white transition-all duration-1000 ease-out" />
                        </svg>
                        <div class="absolute inset-0 flex items-center justify-center text-xs font-bold" id="percentageDisplay">0%</div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content: Meal List -->
    <main class="flex-1 overflow-y-auto meal-list px-6 pb-24 pt-4">
        <div class="flex justify-between items-center mb-4">
            <h3 class="font-semibold text-slate-700">Recent Meals</h3>
            <span class="text-xs font-medium bg-slate-100 text-slate-500 px-2 py-1 rounded-full" id="mealCount">0 meals</span>
        </div>

        <div id="mealsContainer" class="space-y-4">
            <!-- Meal Items will be injected here -->
            <div id="emptyState" class="text-center py-10 opacity-60">
                <i class="bi bi-egg-fried text-4xl text-slate-300 mb-2 block"></i>
                <p class="text-sm text-slate-500">No meals tracked today.<br>Tap the + button to start.</p>
            </div>
        </div>
    </main>

    <!-- Bottom Action Bar -->
    <div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-white via-white to-transparent pt-10 pb-6 px-6 z-20 pointer-events-none flex justify-center">
        <button onclick="triggerCamera()" class="pointer-events-auto bg-slate-900 hover:bg-slate-800 text-white rounded-full w-16 h-16 flex items-center justify-center shadow-2xl transition-transform hover:scale-105 active:scale-95 group">
            <i class="bi bi-plus-lg text-2xl group-hover:rotate-90 transition-transform duration-300"></i>
        </button>
    </div>

    <!-- Hidden File Input -->
    <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="handleImageSelect(event)">

    <!-- Analysis Modal -->
    <div id="analysisModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity duration-300 opacity-0">
        <div class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-6 shadow-2xl transform translate-y-full sm:translate-y-0 transition-transform duration-300 ease-out" id="modalContent">
            
            <!-- Header -->
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg text-slate-800">New Meal Entry</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="bi bi-x-lg"></i></button>
            </div>

            <!-- Image Preview Area -->
            <div class="relative w-full h-48 bg-slate-100 rounded-xl overflow-hidden mb-5 group">
                <img id="imagePreview" src="" class="w-full h-full object-cover" alt="Food preview" />
                <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer" onclick="triggerCamera()">
                    <span class="text-white text-sm font-medium"><i class="bi bi-arrow-repeat mr-1"></i> Retake</span>
                </div>
            </div>

            <!-- Loading State -->
            <div id="loadingState" class="hidden flex-col items-center justify-center py-4 space-y-3">
                <div class="loader"></div>
                <p class="text-sm text-slate-500 animate-pulse">Analyzing nutritional content...</p>
            </div>

            <!-- Analysis Result Form -->
            <div id="resultForm" class="hidden space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-500 uppercase mb-1">Food Name</label>
                    <input type="text" id="foodName" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500 font-medium">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 uppercase mb-1">Calories</label>
                        <div class="relative">
                            <input type="number" id="foodCalories" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500 font-bold text-lg">
                            <span class="absolute right-3 top-2.5 text-xs text-slate-400">kcal</span>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 uppercase mb-1">Health Score</label>
                        <div class="flex items-center h-full">
                            <span id="healthScoreBadge" class="px-2 py-1 rounded-md text-sm font-bold bg-green-100 text-green-700">8/10</span>
                        </div>
                    </div>
                </div>

                <!-- Macros -->
                <div class="grid grid-cols-3 gap-2 text-center text-xs">
                    <div class="bg-orange-50 p-2 rounded-lg border border-orange-100">
                        <p class="text-orange-500 mb-1 font-semibold">Carbs</p>
                        <input type="text" id="foodCarbs" class="w-full bg-transparent text-center font-bold text-slate-700 focus:outline-none" placeholder="0g">
                    </div>
                    <div class="bg-blue-50 p-2 rounded-lg border border-blue-100">
                        <p class="text-blue-500 mb-1 font-semibold">Protein</p>
                        <input type="text" id="foodProtein" class="w-full bg-transparent text-center font-bold text-slate-700 focus:outline-none" placeholder="0g">
                    </div>
                    <div class="bg-yellow-50 p-2 rounded-lg border border-yellow-100">
                        <p class="text-yellow-600 mb-1 font-semibold">Fats</p>
                        <input type="text" id="foodFats" class="w-full bg-transparent text-center font-bold text-slate-700 focus:outline-none" placeholder="0g">
                    </div>
                </div>

                <button onclick="saveMeal()" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 rounded-xl shadow-md active:scale-[0.98] transition-all">
                    Track Meal
                </button>
            </div>

            <!-- Analyze Button (Only visible before analysis) -->
            <button id="analyzeBtn" onclick="analyzeImage()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3 rounded-xl shadow-md flex items-center justify-center gap-2 active:scale-[0.98] transition-all">
                <i class="bi bi-stars text-yellow-400"></i> Analyze with AI
            </button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-slate-900 text-white px-4 py-2 rounded-full shadow-xl z-[60] text-sm opacity-0 transition-opacity duration-300 pointer-events-none flex items-center gap-2">
        <i class="bi bi-check-circle-fill text-green-400"></i> <span id="toastMsg">Saved successfully</span>
    </div>

    <script>
        // State
        let meals = JSON.parse(localStorage.getItem('nutriscan_meals')) || [];
        let dailyGoal = 2000;
        let currentBase64 = null;

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            renderMeals();
            updateStats();
        });

        // Camera & Image Handling
        function triggerCamera() {
            document.getElementById('cameraInput').click();
        }

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                // Resize image to ensure it's not too big for API
                resizeImage(e.target.result, 800, 800, (resizedBase64) => {
                    currentBase64 = resizedBase64;
                    openModal(resizedBase64);
                });
            };
            reader.readAsDataURL(file);
            
            // Reset input so same file can be selected again if needed
            event.target.value = '';
        }

        function resizeImage(base64Str, maxWidth, maxHeight, callback) {
            let img = new Image();
            img.src = base64Str;
            img.onload = () => {
                let canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > maxWidth) {
                        height *= maxWidth / width;
                        width = maxWidth;
                    }
                } else {
                    if (height > maxHeight) {
                        width *= maxHeight / height;
                        height = maxHeight;
                    }
                }
                
                canvas.width = width;
                canvas.height = height;
                let ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                callback(canvas.toDataURL('image/jpeg', 0.7)); // Compress to 0.7 quality
            }
        }

        // Modal Handling
        function openModal(imageSrc) {
            const modal = document.getElementById('analysisModal');
            const modalContent = document.getElementById('modalContent');
            const preview = document.getElementById('imagePreview');
            
            preview.src = imageSrc;
            
            // Reset modal state
            document.getElementById('resultForm').classList.add('hidden');
            document.getElementById('analyzeBtn').classList.remove('hidden');
            document.getElementById('loadingState').classList.add('hidden');
            
            modal.classList.remove('hidden');
            // Trigger reflow for animation
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            modalContent.classList.remove('translate-y-full');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('analysisModal');
            const modalContent = document.getElementById('modalContent');
            
            modal.classList.add('opacity-0');
            modalContent.classList.add('translate-y-full');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                document.body.style.overflow = '';
            }, 300);
        }

        // AI Logic
        async function analyzeImage() {
            if (!currentBase64) return;

            // UI Updates
            document.getElementById('analyzeBtn').classList.add('hidden');
            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('loadingState').classList.add('flex');

            try {
                const response = await fetch('https://r0c8kgwocscg8gsokogwwsw4.zetaverse.one/ai', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer c635xP7tyHOZbGh81aHbQGcC7kG3',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        messages: [
                            {
                                role: "user",
                                content: [
                                    {
                                        type: "text",
                                        text: "Analyze this food image. I need you to act as a nutritionist. Please identify the food item and estimate its calories and macronutrients for the serving size shown. Return ONLY a valid JSON object (no markdown formatting) with these exact keys: 'food_name' (string, concise), 'calories' (number, estimation), 'protein' (string, e.g. '20g'), 'carbs' (string, e.g. '30g'), 'fats' (string, e.g. '10g'), 'health_score' (number from 1-10 where 10 is very healthy)."
                                    },
                                    {
                                        type: "image_url",
                                        image_url: {
                                            url: currentBase64
                                        }
                                    }
                                ]
                            }
                        ]
                    })
                });

                const data = await response.json();
                console.log("AI Response:", data);

                let content = data.message;
                
                // Clean up response if it contains markdown code blocks
                if (content.includes("```json")) {
                    content = content.replace(/```json/g, "").replace(/```/g, "");
                } else if (content.includes("```")) {
                    content = content.replace(/```/g, "");
                }

                const result = JSON.parse(content);
                populateForm(result);

            } catch (error) {
                console.error("Error analyzing image:", error);
                showToast("Failed to analyze image. Try again.", true);
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('analyzeBtn').classList.remove('hidden');
            }
        }

        function populateForm(data) {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('loadingState').classList.remove('flex'); // remove flex to hide completely properly
            document.getElementById('resultForm').classList.remove('hidden');

            document.getElementById('foodName').value = data.food_name || "Unknown Food";
            document.getElementById('foodCalories').value = data.calories || 0;
            document.getElementById('foodProtein').value = data.protein || "0g";
            document.getElementById('foodCarbs').value = data.carbs || "0g";
            document.getElementById('foodFats').value = data.fats || "0g";

            const score = data.health_score || 5;
            const badge = document.getElementById('healthScoreBadge');
            badge.innerText = `${score}/10`;
            
            // Color code the score
            if(score >= 8) { badge.className = "px-2 py-1 rounded-md text-sm font-bold bg-green-100 text-green-700"; }
            else if(score >= 5) { badge.className = "px-2 py-1 rounded-md text-sm font-bold bg-yellow-100 text-yellow-700"; }
            else { badge.className = "px-2 py-1 rounded-md text-sm font-bold bg-red-100 text-red-700"; }
        }

        // Data Logic
        function saveMeal() {
            const meal = {
                id: Date.now(),
                image: currentBase64,
                name: document.getElementById('foodName').value,
                calories: parseInt(document.getElementById('foodCalories').value) || 0,
                protein: document.getElementById('foodProtein').value,
                carbs: document.getElementById('foodCarbs').value,
                fats: document.getElementById('foodFats').value,
                timestamp: new Date().toISOString()
            };

            meals.unshift(meal); // Add to beginning
            localStorage.setItem('nutriscan_meals', JSON.stringify(meals));
            
            renderMeals();
            updateStats();
            closeModal();
            showToast("Meal tracked successfully!");
        }

        function deleteMeal(id) {
            if(confirm("Delete this meal log?")) {
                meals = meals.filter(m => m.id !== id);
                localStorage.setItem('nutriscan_meals', JSON.stringify(meals));
                renderMeals();
                updateStats();
            }
        }

        function resetData() {
            if(confirm("Clear all data?")) {
                meals = [];
                localStorage.removeItem('nutriscan_meals');
                renderMeals();
                updateStats();
                showToast("All data cleared");
            }
        }

        function renderMeals() {
            const container = document.getElementById('mealsContainer');
            document.getElementById('mealCount').innerText = `${meals.length} meals`;
            
            if (meals.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
                container.innerHTML = '';
                container.appendChild(document.getElementById('emptyState'));
                return;
            } else {
                document.getElementById('emptyState').classList.add('hidden');
                container.innerHTML = ''; // Start fresh but keep emptyState in DOM (it's fine if we overwrite innerHTML as long as we recreate the list)
            }

            // check if empty state was the only thing, clear it
            if(container.querySelector('#emptyState')) container.innerHTML = '';

            meals.forEach(meal => {
                const date = new Date(meal.timestamp);
                const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                const el = document.createElement('div');
                el.className = 'bg-white p-3 rounded-xl shadow-sm border border-slate-100 flex items-center gap-3 transition-all hover:shadow-md';
                el.innerHTML = `
                    <div class="h-16 w-16 flex-shrink-0 rounded-lg overflow-hidden bg-slate-100">
                        <img src="${meal.image}" class="h-full w-full object-cover" alt="${meal.name}">
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-start">
                            <h4 class="font-semibold text-slate-800 truncate pr-2">${meal.name}</h4>
                            <span class="text-xs text-slate-400 whitespace-nowrap">${timeStr}</span>
                        </div>
                        <p class="text-brand-600 font-bold mt-0.5">${meal.calories} kcal</p>
                        <p class="text-xs text-slate-500 mt-1 flex gap-2">
                            <span><span class="font-medium">P:</span> ${meal.protein}</span>
                            <span><span class="font-medium">C:</span> ${meal.carbs}</span>
                            <span><span class="font-medium">F:</span> ${meal.fats}</span>
                        </p>
                    </div>
                    <button onclick="deleteMeal(${meal.id})" class="h-8 w-8 flex items-center justify-center text-slate-300 hover:text-red-500 transition-colors">
                        <i class="bi bi-trash"></i>
                    </button>
                `;
                container.appendChild(el);
            });
        }

        function updateStats() {
            const total = meals.reduce((acc, curr) => acc + curr.calories, 0);
            
            // Animate number
            const numberEl = document.getElementById('totalCaloriesDisplay');
            animateValue(numberEl, parseInt(numberEl.innerText), total, 1000);

            // Update Progress Circle
            const percentage = Math.min((total / dailyGoal) * 100, 100);
            const circle = document.getElementById('progressCircle');
            const circumference = 2 * Math.PI * 40; // r=40
            const offset = circumference - (percentage / 100) * circumference;
            
            circle.style.strokeDashoffset = offset;
            
            // Color change based on progress
            if (percentage > 100) {
                circle.classList.add('text-red-500');
                circle.classList.remove('text-white');
            } else {
                circle.classList.add('text-white');
                circle.classList.remove('text-red-500');
            }

            document.getElementById('percentageDisplay').innerText = Math.round(percentage) + '%';
        }

        // Utils
        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = message;
            
            if(isError) {
                toast.querySelector('i').className = "bi bi-exclamation-circle-fill text-red-400";
            } else {
                toast.querySelector('i').className = "bi bi-check-circle-fill text-green-400";
            }
            
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 3000);
        }
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
